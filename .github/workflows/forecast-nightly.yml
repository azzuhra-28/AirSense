name: AirSense Automated Forecast & Analytics Pipeline

on:
  schedule:
    # Berjalan otomatis setiap 30 menit
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # Tombol pemicu manual langsung di tab Actions GitHub

jobs:
  forecast:
    name: Run Forecast and Alert Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r analytics/requirements.txt

      - name: Jalankan RNN Multi-step Forecast (60 Menit ke Depan)
        working-directory: analytics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -m src.run_forecast_rnn --epochs 40

      - name: Jalankan Anomaly Detection & Alert Pipeline
        working-directory: analytics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python ensure_models.py || true
          python -m src.run_pipeline || true