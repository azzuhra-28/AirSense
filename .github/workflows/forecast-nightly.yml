name: AirSense Forecast Pipeline

on:
  schedule:
    # Setiap 10 menit. GitHub menunda cron saat ramai (biasanya 5-20
    # menit), jadi jangan berharap presisi. Repo ini publik, sehingga
    # menit Actions tidak dihitung terhadap kuota.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      retrain:
        description: "Latih ulang model dari nol (lebih lambat)"
        type: boolean
        default: false

# Satu run pada satu waktu. Run yang menunggu dibatalkan kalau sudah
# ada yang lebih baru, supaya tidak menumpuk siklus basi.
concurrency:
  group: airsense-forecast
  cancel-in-progress: true

jobs:
  forecast:
    name: Forecast + Alert
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # torch CPU saja: runner tidak punya GPU, dan versi CUDA
      # menambah ~2 GB unduhan tanpa manfaat.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r analytics/requirements.txt

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: analytics/models
          key: airsense-models-v2
          restore-keys: airsense-models-

      - name: Lewati kalau alat offline
        id: gate
        working-directory: analytics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          import pandas as pd
          from src.supabase_client import SUPABASE_URL, supabase_session

          s = supabase_session()
          r = s.get(
              f"{SUPABASE_URL}/rest/v1/tb_konsentrasi_gas",
              params={"select": "created_at", "order": "created_at.desc", "limit": 1},
              timeout=30,
          ).json()
          if not r:
              print("::warning::Belum ada data sensor.")
              open(os.environ["GITHUB_OUTPUT"], "a").write("run=false\n")
              sys.exit(0)

          last = pd.to_datetime(r[0]["created_at"], utc=True, format="ISO8601")
          age = (pd.Timestamp.now(tz="UTC") - last).total_seconds() / 60
          print(f"Data sensor terakhir {age:.0f} menit lalu.")
          # Forecast dari data basi hanya mengulang angka lama.
          run = "true" if age <= 10 else "false"
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"run={run}\n")
          PY

      - name: Jalankan forecast RNN
        if: steps.gate.outputs.run == 'true'
        working-directory: analytics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          EXTRA=""
          if [ "${{ inputs.retrain }}" = "true" ]; then
            EXTRA="--retrain"
          fi
          python -m src.run_forecast_rnn --device cpu --epochs 40 $EXTRA

      - name: Jalankan deteksi anomali dan alert
        if: steps.gate.outputs.run == 'true'
        working-directory: analytics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python ensure_models.py || true
          python -m src.run_pipeline --alerts-only || true
