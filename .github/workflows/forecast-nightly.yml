name: Forecast Nightly

on:
  schedule:
    # tiap jam (UTC) - sesuaikan kalau mau 15/30 menit:  15 * * * *  /  */30 * * * *
    - cron: "0 * * * *"
  workflow_dispatch: {}   # bolein run manual dari tab Actions

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r analytics/requirements.txt

      - name: Training (otomatis kalau model belum ada)
        working-directory: analytics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python ensure_models.py || (echo "Training gagal / data belum cukup, abaikan." && exit 0)

      - name: Jalankan pipeline (forecast + klasifikasi + alert)
        working-directory: analytics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m src.run_pipeline